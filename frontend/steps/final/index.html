<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiroshima Hazard Map — Re:Earth CMS</title>

    <!-- Leaflet and Tailwind both come from a CDN, so the repo keeps zero
         frontend runtime dependencies. Leaflet is a classic script, so `L` is a
         global by the time the deferred module below runs. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <!-- This file is the same in every folder. The markup lives in
       frontend/common/layout.html, which main.js imports and injects into #app
       below. You should not need to edit this file at any point. -->
  <body class="overflow-hidden bg-slate-50 text-slate-900">
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
